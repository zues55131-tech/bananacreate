name: Testar servidor
on:
  workflow_dispatch:
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Iniciar servidor com o mod
        run: |
          chmod +x gradlew
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\:normal\n' > run/server.properties
          (sleep 200; echo stop) | timeout 420 ./gradlew runServer --no-daemon > server.log 2>&1 || true
          echo "===== RESUMO ====="
          grep -nE "Done \(|bananacreate|Failed|Couldn't parse|Exception|ERROR|Error" server.log | grep -viE "deprecat|DEBUG" | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: server.log

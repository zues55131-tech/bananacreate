name: Sondar versoes
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for v in 6.0.9-216 6.0.10-281 6.0.11-295 6.0.11-300 6.0.11-320; do
            b=https://maven.createmod.net/com/simibubi/create/create-1.21.1/$v/create-1.21.1-$v
            echo "$v jar=$(curl -s -o /dev/null -w '%{http_code}' $b.jar) slim=$(curl -s -o /dev/null -w '%{http_code}' $b-slim.jar) sources=$(curl -s -o /dev/null -w '%{http_code}' $b-sources.jar)"
          done
          echo "### dir listing 6.0.11-320"
          curl -s https://maven.createmod.net/com/simibubi/create/create-1.21.1/6.0.11-320/ | grep -oE 'href="[^"]+"' | head -20

name: Sondar versoes
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "### POM"
          curl -s https://maven.createmod.net/com/simibubi/create/create-1.21.1/6.0.11-320/create-1.21.1-6.0.11-320.pom | grep -E -B1 -A3 "<artifactId>(Ponder|flywheel|Registrate)" | grep -E "artifactId|version" | tr -d ' ' | tr '\n' ' '; echo
          echo "### PONDER last"
          curl -s https://maven.createmod.net/net/createmod/ponder/Ponder-NeoForge-1.21.1/maven-metadata.xml | grep -E "<latest>|<release>"
          echo "### jar checks"
          echo "slim: $(curl -s -o /dev/null -w '%{http_code}' https://maven.createmod.net/com/simibubi/create/create-1.21.1/6.0.11-320/create-1.21.1-6.0.11-320-slim.jar)"
          echo "reg+62: $(curl -s -o /dev/null -w '%{http_code}' 'https://maven.ithundxr.dev/snapshots/com/tterrag/registrate/Registrate/MC1.21-1.3.0+62/Registrate-MC1.21-1.3.0+62.jar')"
          echo "reg+67: $(curl -s -o /dev/null -w '%{http_code}' 'https://maven.ithundxr.dev/snapshots/com/tterrag/registrate/Registrate/MC1.21-1.3.0+67/Registrate-MC1.21-1.3.0+67.jar')"

name: Sondar versoes
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "### ponder dirs"
          curl -s https://maven.createmod.net/net/createmod/ponder/ | grep -oE 'href="[^"]+"' | tr '\n' ' '; echo
          for a in Ponder-NeoForge-1.21.1 Ponder-Common-1.21.1 Ponder-1.21.1; do
            echo "### $a"
            curl -s https://maven.createmod.net/net/createmod/ponder/$a/maven-metadata.xml | grep -E "<latest>|<release>" | tr -d ' \n'; echo
          done
          echo "### create 6.0.10-281 pom deps"
          curl -s https://maven.createmod.net/com/simibubi/create/create-1.21.1/6.0.10-281/create-1.21.1-6.0.10-281.pom | grep -E "artifactId|<version>" | tr -d ' ' | tr '\n' ' ' | cut -c1-700; echo
